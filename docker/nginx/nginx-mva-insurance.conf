# Nginx Configuration برای MVA Insurance RAG System
# This file should be placed in: /etc/nginx/sites-available/mva-insurance

# Upstream Backend Server
upstream mva_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect HTTP to HTTPS (اختیاری)
# server {
#     listen 80;
#     server_name your_domain.com www.your_domain.com;
#     return 301 https://$server_name$request_uri;
# }

# Main Server Block
server {
    listen 80;
    # listen 443 ssl http2;  # Uncomment for HTTPS
    
    server_name your_domain.com www.your_domain.com;
    
    # SSL Configuration (اختیاری)
    # ssl_certificate /etc/letsencrypt/live/your_domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your_domain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Logging
    access_log /var/log/nginx/mva-access.log combined;
    error_log /var/log/nginx/mva-error.log warn;

    # Client Size Limit (برای Upload کردن فایل‌های بزرگ)
    client_max_body_size 100M;

    # Compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1024;

    # ============================================
    # Frontend - Static Files
    # ============================================
    location / {
        root /home/username/MVA_Versicherung_Langchain/frontend/dist;
        
        # SPA Routing - Fallback to index.html
        try_files $uri $uri/ /index.html;
        
        # Cache Control
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Assets with longer cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /home/username/MVA_Versicherung_Langchain/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ============================================
    # Backend API - Reverse Proxy
    # ============================================
    location /api/ {
        proxy_pass http://mva_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ============================================
    # Health Check
    # ============================================
    location /health {
        proxy_pass http://mva_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ============================================
    # API Documentation (Swagger UI)
    # ============================================
    location /docs {
        proxy_pass http://mva_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://mva_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ============================================
    # Security Headers
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ============================================
    # Deny Access to Sensitive Files
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
