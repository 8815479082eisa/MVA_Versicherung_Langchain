name: Groundedness Regression Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/groundedness-regression-smoke.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Abschluss-Arbeit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest langchain-core pydantic "nemoguardrails>=0.21,<0.22" dataclasses-json
      - name: Run claim groundedness regressions
        run: pytest -q tests/unit/test_claim_groundedness.py
