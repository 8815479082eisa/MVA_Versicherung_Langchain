name: Groundedness Pipeline Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/groundedness-pipeline-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANSWER_PROVIDER: openai
      ANSWER_MODEL: gpt-4o-mini
      PREFERRED_ANSWER_MODEL: gpt-4o-mini
      GROUNDEDNESS_MODEL: gpt-4o-mini
      FORCE_RETRIEVAL: "true"
      QUERY_REWRITE_ENABLED: "false"
      SELF_CHECK_ENABLED: "false"
      ANSWER_COMPLETENESS_ENABLED: "false"
      FAQ_ONLY: "false"
      CRM_ENABLED: "false"
      SAFETY_ENABLED: "true"
      SAFETY_MODE: enforce
      SAFETY_BACKEND: nemo
      NEMO_ENFORCE_OUTPUT: "true"
      INIT_PIPELINE_ON_STARTUP: "false"
      API_REQUEST_TIMEOUT_SECONDS: "300"
      LLM_TIMEOUT_ANSWER_SECONDS: "150"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: Abschluss-Arbeit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check live-model credential
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY_MISSING"
            exit 78
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run groundedness unit regressions
        run: pytest -q tests/unit/test_claim_groundedness.py

      - name: Start backend
        run: |
          python -m uvicorn src.main:app --host 127.0.0.1 --port 8000 > /tmp/mva-backend.log 2>&1 &
          echo $! > /tmp/mva-backend.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mva-backend.log
          exit 1

      - name: Ask territorial-scope question
        run: |
          python - <<'PY'
          import json
          import urllib.request

          question = (
              "What is the territorial scope of the motor vehicle insurance, including "
              "the excluded countries, the rule for Kosovo, and the coverage during transport by sea?"
          )
          body = json.dumps({"question": question}).encode("utf-8")
          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/ask",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=360) as response:
              payload = json.loads(response.read().decode("utf-8"))
          print("PIPELINE_RESPONSE_BEGIN")
          print(json.dumps(payload, indent=2, ensure_ascii=False))
          print("PIPELINE_RESPONSE_END")
          answer = (payload.get("answer") or "").casefold()
          fallback_markers = (
              "i cannot provide a safe, policy-compliant answer",
              "could not generate a reliable answer",
          )
          if any(marker in answer for marker in fallback_markers):
              raise SystemExit("PIPELINE_RETURNED_FALLBACK")
          PY

      - name: Print backend log
        if: always()
        run: |
          echo "BACKEND_LOG_BEGIN"
          tail -n 400 /tmp/mva-backend.log 2>/dev/null || true
          echo "BACKEND_LOG_END"
