name: Temporary routing and reranker regression checks

on:
  push:
    branches:
      - Abschluss-Arbeit

jobs:
  regression-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest langchain-core pydantic python-dotenv "nemoguardrails>=0.21,<0.22" dataclasses-json openai "httpx>=0.27,<1"

      - name: Run focused regression tests
        run: |
          pytest -q \
            tests/unit/test_insurance_tool_routing.py \
            tests/unit/test_controlled_abstention.py \
            tests/unit/test_reranker_windowing.py

      - name: Check legal reference PII regression
        run: |
          python - <<'PY'
          from src.core.safety_audit import detect_pii, sanitize_pii
          from src.config.models import SafetyConfig

          config = SafetyConfig(
              enabled=True,
              mode="enforce",
              min_groundedness=0.51,
              block_pii=True,
              block_injection=True,
              fail_closed=True,
              fallback_text="fallback",
              backend="nemo",
              authenticated=True,
          )
          legal = "Art. 90 para. 4 of the Road Traffic Act applies in this case."
          items = detect_pii(legal, config)
          assert not [item for item in items if item.pii_type == "address"], items
          assert sanitize_pii(legal, items, config) == legal

          address = "The correspondence address is 4 Old Mill Road."
          address_items = detect_pii(address, config)
          assert [item for item in address_items if item.pii_type == "address"], address_items
          PY
